<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Compendium Responses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--blue:#483fb6;--soft:#7a74c6;--line:#d9d8e8;--pane:#f4f3fb;--pink:#f6cde0;--mine:#d8d4fb}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#fff;color:var(--blue);font:13px/1.55 "Space Mono","Courier New",monospace}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 24px;border-bottom:3px solid var(--blue)}
h1{margin:0;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
button{font:700 12px "Space Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--blue);border:3px solid;border-color:#9f9bd4 #2a2470 #2a2470 #9f9bd4;padding:9px 14px;cursor:pointer;min-height:40px}
button.ghost{background:#fff;color:var(--blue)}
input{font:13px "Space Mono",monospace;color:var(--blue);padding:9px 10px;border:2px solid;border-color:#9f9bd4 #fff #fff #9f9bd4;box-shadow:inset 1px 1px 0 var(--blue);width:100%}
label{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:6px}
.login{max-width:380px;margin:12vh auto;padding:24px;border:3px solid var(--blue);display:flex;flex-direction:column;gap:14px}
.err{color:#c0392b;font-size:12px;min-height:1em;margin:0}
main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 80px)}
@media(max-width:820px){main{grid-template-columns:1fr}}
aside{border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.who{all:unset;display:block;padding:10px 12px;border:2px solid var(--line);cursor:pointer}
.who:hover,.who:focus-visible{border-color:var(--blue)}
.who.on{border-color:var(--blue);background:var(--pane)}
.who b{display:block;font-size:14px}
.who small{display:block;color:var(--soft);font-size:11px}
section#detail{padding:20px 28px 60px;display:flex;flex-direction:column;gap:22px;overflow:auto}
h2{margin:0;font-size:22px}
h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid var(--blue);padding-bottom:4px}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--soft);font-size:12px}
.qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 18px;padding:8px 0;border-bottom:1px dotted var(--line)}
@media(max-width:820px){.qa{grid-template-columns:1fr}}
.qa .q{color:var(--soft)}
.qa .a{font-weight:700;white-space:pre-wrap}
.note{border:2px dashed var(--blue);padding:10px 12px;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.note .src{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.note .quote{font:italic 16px/1.45 "EB Garamond",Georgia,serif;color:#1a1a1a;background:var(--mine);padding:2px 4px;align-self:flex-start}
.note .lulah{font-size:12px;color:var(--soft)}
.empty{color:var(--soft)}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{text-align:left;padding:5px 8px;border-bottom:1px dotted var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tools{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<header><h1>The Compendium · Responses</h1><div class="tools" id="tools" hidden><button class="ghost" id="refresh" type="button">Refresh</button><button class="ghost" id="csv" type="button">Download CSV</button><button class="ghost" id="json" type="button">Download JSON</button></div></header>

<p class="login" id="nokey" hidden>This page needs your private link. Open it from the link you saved.</p>

<main id="app" hidden>
  <aside id="list" aria-label="Visitors"></aside>
  <section id="detail" aria-live="polite"><p class="empty">Choose a visitor.</p></section>
</main>

<script>
(function(){
"use strict";
const SB_URL="https://tmojrzfkyxdnhvxsrjdp.supabase.co",SB_KEY="sb_publishable_77y2BrAleX6d-J1z430tSA_b3tg2F8k";
const KEY=decodeURIComponent(location.hash.slice(1));
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when=t=>t?new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"–";
const mins=(a,b)=>a&&b?Math.max(0,Math.round((new Date(b)-new Date(a))/60000)):null;
const FOLDERS={white:"The Color White",headwrap:"Performing Excess"};
let rows=[],cur=null;

function start(){
  if(!KEY){$("nokey").hidden=false;return}
  $("app").hidden=false;$("tools").hidden=false;load();
}
$("refresh").addEventListener("click",load);

async function load(){
  $("list").innerHTML='<p class="empty">Loading…</p>';
  let data=null,error=null;
  try{const r=await fetch(SB_URL+"/rest/v1/rpc/read_compendium",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_key:KEY})});
    if(r.ok)data=await r.json();else error={message:"Couldn't load responses ("+r.status+"). Check the link and that the setup file was run."}}catch(e){error={message:"Couldn't reach the database. Try Refresh."}}
  if(error){$("list").innerHTML=`<p class="err">${esc(error.message)}</p>`;return}
  rows=data||[];
  if(!rows.length){$("list").innerHTML='<p class="empty">No visitors yet.</p>';$("detail").innerHTML="";return}
  $("list").innerHTML=`<p class="empty">${rows.length} ${rows.length===1?"visitor":"visitors"}</p>`+rows.map((r,i)=>{const d=r.data||{},m=mins(d.firstSeenAt||r.created_at,d.updatedAt||r.updated_at);
    return `<button class="who" type="button" data-i="${i}"><b>${esc(r.name||"(no name yet)")}</b><small>${when(r.created_at)}${m!=null?` · ${m} min`:""}${d.closing?" · finished":""}</small></button>`}).join("");
  $("list").querySelectorAll(".who").forEach(b=>b.addEventListener("click",()=>show(+b.dataset.i)));
  show(cur!=null&&cur<rows.length?cur:0);
}
function qa(q,a){return `<div class="qa"><div class="q">${esc(q)}</div><div class="a">${esc(a||"–")}</div></div>`}
function show(i){
  cur=i;const r=rows[i],d=r.data||{};
  $("list").querySelectorAll(".who").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
  const out=[];
  out.push(`<div><h2>${esc(r.name||"(no name yet)")}</h2><div class="meta"><span>First seen ${when(d.firstSeenAt||r.created_at)}</span><span>Last active ${when(d.updatedAt||r.updated_at)}</span><span>${mins(d.firstSeenAt||r.created_at,d.updatedAt||r.updated_at)??"–"} min on the site</span><span>${esc(d.screen||"")}</span></div></div>`);
  const f=d.folders||{};
  Object.keys(FOLDERS).forEach(id=>{const g=f[id];
    let h=`<div><h3>${FOLDERS[id]}</h3>`;
    if(!g){out.push(h+'<p class="empty">Not opened.</p></div>');return}
    h+=`<div class="meta"><span>Opened ${g.opens||0}×</span><span>Images opened: ${esc((g.photosOpened||[]).join(", ")||"none")}</span><span>Annotation files opened: ${(g.docsOpened||[]).length}</span>${g.knowOpened?"<span>Opened Know more</span>":""}</div>`;
    const b=g.before||{};h+=Object.keys(b).length?`<p class="q" style="margin:10px 0 0;font-weight:700">First look</p>`+Object.entries(b).map(([q,a])=>qa(q,a)).join(""):'<p class="empty">No first-look answers.</p>';
    const rp=g.replies||{};const ks=Object.keys(rp);
    if(ks.length)h+=`<p style="margin:12px 0 0;font-weight:700">Replies to my comments</p>`+ks.map(k=>{const v=rp[k];return typeof v==="string"?qa(k,v):`<div class="note"><span class="src">${esc(v.file)}${v.by?" · "+esc(v.by):""}</span><span class="lulah">My note: ${esc(v.note)}</span>${qa(v.q,v.a)}</div>`}).join("");
    if(g.after)h+=`<p style="margin:12px 0 0;font-weight:700">Look again</p>`+Object.entries(g.after).map(([q,a])=>qa(q,a)).join("");
    out.push(h+"</div>");
  });
  const rn=d.readerNotes||{};const all=Object.entries(rn).flatMap(([k,list])=>(list||[]).map(n=>({...n,k})));
  out.push(`<div><h3>Their highlights &amp; comments (${all.length})</h3>${all.length?all.sort((a,b)=>String(a.at).localeCompare(b.at)).map(n=>`<div class="note"><span class="src">${esc(n.win||n.k)} · ${when(n.at)}</span>${n.quote?`<span class="quote">“${esc(n.quote)}”</span>`:""}<span class="a" style="font-weight:700">${n.comment?esc(n.comment):'<span class="empty">Highlighted only</span>'}</span></div>`).join(""):'<p class="empty">None.</p>'}</div>`);
  if(d.closing)out.push(`<div><h3>Last questions</h3>${Object.entries(d.closing).map(([q,a])=>qa(q,a)).join("")}</div>`);
  const ws=(d.windows||[]);
  out.push(`<div><h3>Everything they opened, in order</h3>${ws.length?`<table><thead><tr><th>Time</th><th>Window</th><th>Stayed</th></tr></thead><tbody>${ws.map(w=>`<tr><td>${when(w.openedAt)}</td><td>${esc(w.title||w.key)}</td><td>${w.seconds!=null?(w.seconds>=60?Math.round(w.seconds/60)+" min":w.seconds+" s"):"left open"}</td></tr>`).join("")}</tbody></table>`:'<p class="empty">Nothing yet.</p>'}</div>`);
  $("detail").innerHTML=out.join("");
}
function dl(name,type,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("json").addEventListener("click",()=>dl("compendium-responses.json","application/json",JSON.stringify(rows,null,2)));
$("csv").addEventListener("click",()=>{
  const lines=[["visitor","started","section","item","question or quote","answer or comment","time"]];
  rows.forEach(r=>{const d=r.data||{},n=r.name||"",st=d.firstSeenAt||r.created_at;
    Object.entries(d.folders||{}).forEach(([fid,g])=>{const F=FOLDERS[fid]||fid;
      Object.entries(g.before||{}).forEach(([q,a])=>lines.push([n,st,F,"first look",q,a,g.beforeAt||""]));
      Object.values(g.replies||{}).forEach(v=>typeof v==="string"?0:lines.push([n,st,F,"reply · "+v.file,v.q,v.a,v.at]));
      Object.entries(g.after||{}).forEach(([q,a])=>lines.push([n,st,F,"look again",q,a,g.afterAt||""]))});
    Object.values(d.readerNotes||{}).flat().forEach(x=>lines.push([n,st,"annotation",x.win||"",x.quote||"",x.comment||"(highlight)",x.at]));
    Object.entries(d.closing||{}).forEach(([q,a])=>lines.push([n,st,"closing","",q,a,d.closedAt||""]));
  });
  dl("compendium-responses.csv","text/csv",lines.map(l=>l.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n"));
});
start();
})();
</script>
</body>
</html>
